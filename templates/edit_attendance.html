<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attendance - Attendance Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Edit Attendance Record</h1>
            <a href="{{ url_for('index', subject_id=record.subject_id) }}" class="back-btn">Back to List</a>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="form-container">
            <form method="POST" action="{{ url_for('edit_attendance', record_id=record.id) }}">
                <div class="form-group">
                    <label>Subject:</label>
                    <input type="text" value="{{ record.subject.name }}" disabled>
                </div>
                <div class="form-group">
                    <label>Student Name:</label>
                    <input type="text" value="{{ record.student_name }}" disabled>
                </div>
                <div class="form-group">
                    <label>Register No:</label>
                    <input type="text" value="{{ record.register_no }}" disabled>
                </div>
                <div class="form-group">
                    <label>Date:</label>
                    <input type="text" value="{{ record.date.strftime('%Y-%m-%d') }}" disabled>
                </div>
                <div class="form-group">
                    <label>Time:</label>
                    <input type="text" value="{{ record.time.strftime('%H:%M:%S') }}" disabled>
                </div>
                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status" name="status" required>
                        <option value="Present" {% if record.status == 'Present' %}selected{% endif %}>Present</option>
                        <option value="Absent" {% if record.status == 'Absent' %}selected{% endif %}>Absent</option>
                        <option value="OD" {% if record.status == 'OD' %}selected{% endif %}>OD</option>
                    </select>
                </div>
                <button type="submit">Update Status</button>
            </form>
        </div>
    </div>
</body>
</html>
